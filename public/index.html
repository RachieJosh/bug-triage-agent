<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Triage Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Verdana, Geneva, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #e2e8f0;
    transition: background 0.3s, color 0.3s;
  }

  body.light {
    background: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 100%);
    color: #1e293b;
  }
  body.light .card { background: #ffffff; border-color: #e2e8f0; }
  body.light textarea, body.light select { background: #f8fafc; color: #1e293b; border-color: #cbd5e1; }
  body.light .explanation { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
  body.light .subtitle { color: #64748b; }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    max-width: 620px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transition: background 0.3s, border-color 0.3s;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .header .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header .icon { font-size: 28px; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #818cf8, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #themeToggle {
    background: none;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: inherit;
    width: auto;
    cursor: pointer;
    font-family: Verdana, Geneva, sans-serif;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 20px;
  }

  select#projectSelect {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1.5px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-family: Verdana, Geneva, sans-serif;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    height: 130px;
    padding: 14px;
    border-radius: 10px;
    border: 1.5px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    font-family: Verdana, Geneva, sans-serif;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: #6366f1; }

  button#submitBtn {
    margin-top: 14px;
    padding: 12px 24px;
    background: linear-gradient(90deg, #6366f1, #38bdf8);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
    font-family: Verdana, Geneva, sans-serif;
    transition: opacity 0.2s;
  }

  button#submitBtn:hover { opacity: 0.9; }
  button#submitBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result { margin-top: 24px; display: none; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #334155;
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .explanation {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #cbd5e1;
    white-space: pre-wrap;
  }

  .ticket-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ticket-box .left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .ticket-box a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
  }

  .ticket-box a:hover { text-decoration: underline; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    background: #22c55e;
    color: #052e16;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-group">
        <span class="icon">🐞</span>
        <h1>Bug Triage Agent</h1>
      </div>
      <button id="themeToggle">🌙 Dark</button>
    </div>
    <p class="subtitle">Paste a bug report. The agent analyzes it and files a Jira ticket on its own.</p>

    <select id="projectSelect">
      <option value="SCRUM">Bug Triage</option>
      <option value="QTCG">QA Test Cases Generator</option>
    </select>

    <textarea id="bugReport" placeholder="Describe the bug..."></textarea>
    <button id="submitBtn">Analyze &amp; Triage</button>

    <div class="result" id="result">
      <div class="status-line" id="statusLine">
        <div class="spinner"></div>
        <span id="statusText">Agent is reasoning through this...</span>
      </div>
      <div class="explanation" id="explanation"></div>
      <div class="ticket-box" id="ticketBox" style="display:none;">
        <div class="left">
          <span class="badge">✓ Filed</span>
          <span id="ticketId"></span>
        </div>
        <a id="ticketLink" href="#" target="_blank">View in Jira →</a>
      </div>
    </div>

    <div class="footer">Powered by Claude AI · Built by Racheal Joshua</div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      themeToggle.textContent = isLight ? '☀️ Light' : '🌙 Dark';
    });

    const projectSelect = document.getElementById('projectSelect');
    const btn = document.getElementById('submitBtn');
    const textarea = document.getElementById('bugReport');
    const result = document.getElementById('result');
    const statusLine = document.getElementById('statusLine');
    const explanation = document.getElementById('explanation');
    const ticketBox = document.getElementById('ticketBox');
    const ticketId = document.getElementById('ticketId');
    const ticketLink = document.getElementById('ticketLink');

    btn.addEventListener('click', async () => {
      const bugReport = textarea.value.trim();
      if (!bugReport) return;

      btn.disabled = true;
      btn.textContent = 'Analyzing...';
      result.style.display = 'block';
      statusLine.style.display = 'flex';
      explanation.textContent = '';
      ticketBox.style.display = 'none';

      try {
        const res = await fetch('/triage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bugReport, projectKey: projectSelect.value }),
        });
        const data = await res.json();

        statusLine.style.display = 'none';
        explanation.textContent = data.explanation || '';

        if (data.ticket?.success) {
          ticketBox.style.display = 'flex';
          ticketId.textContent = data.ticket.ticket_id;
          ticketLink.href = data.ticket.ticket_url;
        }
      } catch (err) {
        statusLine.style.display = 'none';
        explanation.textContent = 'Something went wrong: ' + err.message;
      }

      btn.disabled = false;
      btn.textContent = 'Analyze & Triage';
    });
  </script>
</body>
</html>
